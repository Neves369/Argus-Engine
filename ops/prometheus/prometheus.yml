global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerting-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: argus
    metrics_path: /metrics
    static_configs:
      - targets:
          - backend:8000
    # Sem autenticação em /metrics; a rede do compose já isola o backend.