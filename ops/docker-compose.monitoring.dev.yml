name: argus

# Observabilidade LOCAL (build dev, sem GHCR/Traefik). Merge com o compose
# base — a mesma rede `argus` alcança o backend em `backend:8000`:
#
#   docker compose -f docker-compose.yml -f ops/docker-compose.monitoring.dev.yml up -d --build
#
# Prometheus ganha porta 9090 exposta (inspeção local de targets/alertas);
# TSDB/Grafana ficam em volumes nomeados do projeto `argus` (isolados do deploy
# de produção, cujo projeto é `argus-prod`). Limpe com `down -v`.

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./ops/prometheus:/etc/prometheus:ro
      - argus-prometheus-data:/prometheus
    ports:
      - "9090:9090"

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./ops/alertmanager:/etc/alertmanager:ro
    ports:
      - "9093:9093"

  grafana:
    image: grafana/grafana:11.2.2
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - argus-grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  argus-prometheus-data:
  argus-grafana-data: