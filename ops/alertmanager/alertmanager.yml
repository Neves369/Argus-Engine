# Roteamento base. O receptor `default` sem integração ativa apenas entrega os
# alertas na UI do Alertmanager (:9093). Para notificar de verdade, adicione
# aqui o seu receptor (Slack/email/webhook) e ajuste o roteamento:
#
#   receivers:
#     - name: default
#       webhook_configs:
#         - url: https://hooks.slack.com/services/XXXX/YYYY/ZZZZ
#       # ou, para e-mail (requer SMTP):
#       email_configs:
#         - to: ops@example.com
#           from: alertmanager@example.com
#           smarthost: smtp.example.com:587
#           auth_username: alertmanager
#           auth_password: 'segredo'
#
# Depois de alterar, reinicie o serviço: docker compose <args> restart alertmanager.
global:
  resolve_timeout: 5m

route:
  group_by: ['alertname']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: default

receivers:
  - name: default