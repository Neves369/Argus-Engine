# Roteamento base. Configure um receptor real (Slack/email/HTTP) aqui e ajuste
# o `url` do webhook da seção `receivers`.
global:
  resolve_timeout: 5m

route:
  group_by: ['alertname']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: default

receivers:
  - name: default
    # Exemplo com webhook genérico; troque pelo seu notificador.
    webhook_configs:
      - url: http://placeholder.invalid/webhook