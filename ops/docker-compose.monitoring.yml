name: argus-prod

# Stack de observabilidade OPCIONAL para o deploy de produção. Use em conjunto
# com o compose de produção:
#
#   docker compose -f docker-compose.prod.yml -f ops/docker-compose.monitoring.yml up -d
#
# O merge mantém o projeto `argus-prod`: o Prometheus alcança o `backend` pela
# rede padrão e o Grafana já chega provisionado com datasource + dashboard.
# Dados de TSDB/Grafana/Loki ficam em volumes nomeados (`argus-*-data`); os
# binds são apenas de config (read-only). O receptor real do Alertmanager é
# configurado em `ops/alertmanager/alertmanager.yml` (sem webhook fake).

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./ops/prometheus:/etc/prometheus:ro
      - argus-prometheus-data:/prometheus
    expose:
      - "9090"

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./ops/alertmanager:/etc/alertmanager:ro
    ports:
      - "9093:9093"

  grafana:
    image: grafana/grafana:11.2.2
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD é obrigatória}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - argus-grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  loki:
    image: grafana/loki:3.3.2
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./ops/loki:/etc/loki:ro
      - argus-loki-data:/loki
    expose:
      - "3100"

  promtail:
    image: grafana/promtail:3.3.2
    restart: unless-stopped
    command:
      - -config.file=/etc/promtail/config.yml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./ops/promtail:/etc/promtail:ro

volumes:
  argus-prometheus-data:
  argus-grafana-data:
  argus-loki-data: