name: argus-prod

# Stack de observabilidade OPCIONAL para o deploy de produção. Use em conjunto
# com o compose de produção:
#
#   docker compose -f docker-compose.prod.yml -f ops/docker-compose.monitoring.yml up -d
#
# O merge mantém o projeto `argus-prod`: o Prometheus alcança o `backend` pela
# rede padrão e o Grafana já chega provisionado com datasource + dashboard.
# Para coleção de logs (Loki + promtail), veja docs/RUNBOOK §13.

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./ops/prometheus:/etc/prometheus
      - ./data/prometheus:/prometheus
    expose:
      - "9090"

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./ops/alertmanager:/etc/alertmanager
    ports:
      - "9093:9093"

  grafana:
    image: grafana/grafana:11.2.2
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards
      - ./data/grafana:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus