name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check app tests
      - name: Tests (pytest)
        run: pytest -q

  frontend:
    name: Frontend (lint + type-check + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci
      - name: Lint (eslint)
        run: npm run lint
      - name: Type-check + build (tsc -b && vite build)
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browser (chromium)
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run E2E suite
        working-directory: frontend
        run: npm run e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  compose:
    name: Docker compose (config + build images)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose config
        run: docker compose config --quiet
      - name: Validate production compose config
        env:
          GHCR_OWNER: ci
          TAG: 0.0.0
          DOMAIN: argus.example.org
          ACME_EMAIL: ci@example.org
          UI_PASSWORD: ci
        run: docker compose -f docker-compose.prod.yml config --quiet
      - name: Validate production + monitoring compose merge
        env:
          GHCR_OWNER: ci
          TAG: 0.0.0
          DOMAIN: argus.example.org
          ACME_EMAIL: ci@example.org
          UI_PASSWORD: ci
          GRAFANA_ADMIN_PASSWORD: ci-monitoring
        run: docker compose -f docker-compose.prod.yml -f ops/docker-compose.monitoring.yml config --quiet
      - name: Validate dev + monitoring compose merge
        run: docker compose -f docker-compose.yml -f ops/docker-compose.monitoring.dev.yml config --quiet
      - name: Validate ops scripts syntax
        run: bash -n ops/argus.sh
      - name: Build images (backend + frontend, no push)
        run: docker compose build --pull

  release:
    name: Release (GHCR images)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_BASE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}-backend:${{ github.ref_name }}
            ${{ env.IMAGE_BASE }}-backend:latest
      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}-frontend:${{ github.ref_name }}
            ${{ env.IMAGE_BASE }}-frontend:latest
